[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gr00t-tactile"
version = "0.1.0"
description = "Tactile-conditioned GR00T fine-tuning for whole-body control"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==1.26.4",
    "torch==2.9.0",
    "torchvision==0.24.0",
    "pyyaml",
]

[project.scripts]
gr00t-tactile-finetune = "gr00t_tactile.training.finetune:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gr00t_tactile*"]
